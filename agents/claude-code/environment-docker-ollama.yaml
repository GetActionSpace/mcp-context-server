# MCP Context Server Integration
# Lightweight environment for universal MCP Context Server integration.
# Provides persistent memory across Claude Code sessions via context server hooks and skills.
# Downloads the PostgreSQL+Ollama compose file and starts the stack automatically.
#
# Prerequisites:
#   - uv (required for PEP 723 hooks with inline dependencies; auto-installed by setup-environment.ps1)
#   - Docker Desktop running (required to start the MCP Context Server)

name: MCP Context Server Integration (Ollama Models Only)

description: |
  For more information, see:
  https://github.com/GetActionSpace/mcp-context-server/blob/main/docs/connecting-ai-assistant.md#one-command-setup

# Additional files to download (utility modules loaded by other hooks at runtime,
# plus uv sidecar lockfiles for the hooks below that declare PEP 723 dependencies:
# uv run detects a `<script>.py.lock` file next to a script and installs straight
# from it, skipping dependency resolution and registry-metadata refresh at every
# hook launch, which avoids transient uv cache-write failures on Windows and makes
# hook startup deterministic and faster)
files-to-download:
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/hook_config_loader.py
    dest: ~/.claude/hooks/
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/hook_json_output.py
    dest: ~/.claude/hooks/
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/user_prompt_context_saver.py.lock
    dest: ~/.claude/hooks/user_prompt_context_saver.py.lock
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/worktree_context.py.lock
    dest: ~/.claude/hooks/worktree_context.py.lock
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/context_awareness_guidance.py.lock
    dest: ~/.claude/hooks/context_awareness_guidance.py.lock
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/subagent_context_protocol_injection.py.lock
    dest: ~/.claude/hooks/subagent_context_protocol_injection.py.lock
  - source: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/deploy/docker/docker-compose.postgresql.ollama.yml
    dest: ~/.mcp/docker-compose.postgresql.ollama.yml

# Start the stack after the compose file has been downloaded.
dependencies:
  common:
    - docker compose -f ~/.mcp/docker-compose.postgresql.ollama.yml up -d

# Environment variables
os-env-variables:
  # A base install writes this block to the OS environment (the Windows registry, the
  # shell rc files on Unix) and deletes the OS-level variable a null entry names; an
  # isolated install writes it to the profile's env loader files instead, a null entry
  # as an unset line. Nothing this environment ships needs that reach: its hooks run
  # inside a Claude Code session, which hands them the user-settings `env` block below,
  # so the block holds only the transitional deletion of the one name that block carries.

  # TRANSITIONAL -- a deletion, not a setting. CLAUDE_HOOK_DEBUG_ENABLED is declared in
  # the user-settings `env` block below, and this null removes the OS-level copy that an
  # earlier base install of this environment wrote. It is spelled out rather than simply
  # omitted because an omitted key leaves the stale OS value in place, where it is
  # harmless inside a session but misleading to anyone reading
  # `echo $CLAUDE_HOOK_DEBUG_ENABLED`.
  #
  # Retire it -- remove the null, and with it this block -- once every machine running
  # this environment has completed one base install carrying it. A name parked here
  # permanently also deletes the variable for anything else on the machine that sets it.
  CLAUDE_HOOK_DEBUG_ENABLED: null

# Skills for context management
skills:
  - name: context-metadata-schema
    base: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/common/skills/context-metadata-schema
    files:
      - SKILL.md

  - name: context-retrieval-protocol
    base: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/common/skills/context-retrieval-protocol
    files:
      - SKILL.md

  - name: context-preservation-protocol
    base: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/common/skills/context-preservation-protocol
    files:
      - SKILL.md

  - name: issue-tracking-protocol
    base: https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/common/skills/issue-tracking-protocol
    files:
      - SKILL.md

# Rules for context server usage guidance
rules:
  - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/rules/context-server-integration.md

# MCP server configuration
mcp-servers:
  - name: context-server
    scope: user
    transport: http
    url: http://localhost:8000/mcp

# Hook system for context management
hooks:
  files:
    # Context persistence hooks and configs
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/user_prompt_context_saver.py
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/configs/user_prompt_context_saver_config.yaml

    # Project identity
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/worktree_context.py

    # Session context hooks
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/thread_id_context.py
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/timezone_date_context.py

    # Context lifecycle hooks and configs
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/context_awareness_guidance.py
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/configs/context_awareness_guidance_config.yaml

    # Subagent context protocol injection and its config - SubagentStart store/retrieve protocol
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/subagent_context_protocol_injection.py
    - https://raw.githubusercontent.com/GetActionSpace/mcp-context-server/main/agents/claude-code/hooks/configs/subagent_context_protocol_injection_config.yaml

  events:
    # SessionStart context hooks (ORDER MATTERS: worktree BEFORE thread_id)
    - event: SessionStart
      matcher: '*'
      type: command
      command: worktree_context.py

    - event: SessionStart
      matcher: '*'
      type: command
      command: thread_id_context.py

    - event: SessionStart
      matcher: '*'
      type: command
      command: timezone_date_context.py

    # Post-compaction recovery guidance for the main agent
    - event: SessionStart
      matcher: '*'
      type: command
      command: context_awareness_guidance.py
      config: context_awareness_guidance_config.yaml

    # Subagent context protocol injection - retrieve-first / store-before-stop protocol at spawn
    - event: SubagentStart
      matcher: '*'
      type: command
      command: subagent_context_protocol_injection.py
      config: subagent_context_protocol_injection_config.yaml

    # Subagent context injection - mirrors SessionStart context for spawned subagents
    - event: SubagentStart
      matcher: '*'
      type: command
      command: worktree_context.py

    - event: SubagentStart
      matcher: '*'
      type: command
      command: thread_id_context.py

    - event: SubagentStart
      matcher: '*'
      type: command
      command: timezone_date_context.py

    # Context preservation during workflow. The hook's own budget (90 seconds in its
    # config, counted from the hook's launch) must end before this timeout, or Claude
    # Code kills it with its output discarded.
    - event: UserPromptSubmit
      type: command
      command: user_prompt_context_saver.py
      config: user_prompt_context_saver_config.yaml
      timeout: 120

    # A blocking SubagentStop report-saver is intentionally NOT registered here.
    # A blocking stop-time hook forces an extra turn after a subagent finishes and
    # can overwrite the subagent's returned result with a one-line confirmation --
    # wrong for this lightweight, general-purpose integration where callers expect
    # the subagent's actual output. Store-before-stop is instead encouraged
    # non-blockingly via the SubagentStart context protocol injection above, plus
    # the context-management skills and rules bundled with this environment.

# Permissions configuration. Declared under user-settings (raw settings.json
# content, camelCase keys) because that is the only surface the setup writes
# to ~/.claude/settings.json; a root-level permissions key is not part of the
# configuration schema and would be silently ignored at install time.
user-settings:
  # Claude-level environment variables. Claude Code assigns this block into its own
  # process environment at startup, so a value here takes effect at the next session
  # start instead of only in terminals opened after the install, every process the
  # session starts -- the hooks below included -- inherits it, and it wins over an
  # OS-level variable of the same name. Values must be strings; an unquoted YAML
  # integer is rejected rather than coerced.
  env:
    # MCP server STARTUP budget in milliseconds (default 30000), not tool execution.
    # Raised so a slow uvx-spawned stdio server survives a cold start.
    MCP_TIMEOUT: "300000"

    # Cap on a single MCP tool response.
    MAX_MCP_OUTPUT_TOKENS: "100000"

    # Defer MCP tools behind on-demand tool search instead of loading every schema
    # upfront. The documented values are true, auto, auto:N and false; "1" also happens
    # to enable it, because the parser falls through to a plain truthiness test, but it
    # is not one of the spellings the documentation guarantees, so the documented one is
    # what is written here.
    ENABLE_TOOL_SEARCH: "true"

    # Enable the context saver hook's diagnostic logging so a failed store (for example,
    # the context server still starting while Ollama pulls its embedding and summary
    # models) is recorded in the hook log instead of failing silently. Read by the hook
    # script, which the session starts and which therefore inherits this block. The log
    # is .claude/.hook_debug.log under the project the session started in, or the file
    # CLAUDE_HOOK_DEBUG_FILE names when that is set.
    CLAUDE_HOOK_DEBUG_ENABLED: "1"

  permissions:
    defaultMode: default

    allow:
      - mcp__context-server__search_context
      - mcp__context-server__get_context_by_ids
      - mcp__context-server__store_context
      - mcp__context-server__update_context
      - mcp__context-server__hybrid_search_context
      - mcp__context-server__semantic_search_context
      - mcp__context-server__fts_search_context
      - mcp__context-server__list_threads
      - mcp__context-server__get_statistics

    ask:
      - mcp__context-server__store_context_batch
      - mcp__context-server__update_context_batch
      - mcp__context-server__delete_context
      - mcp__context-server__delete_context_batch

post-install-notes: |
  MCP Context Server is deploying at: http://localhost:8000/mcp

  First-run: Ollama pulls qwen3-embedding:0.6b and qwen3:0.6b (~1.2 GB). Allow 2-5 minutes.

  Follow progress:
    docker compose -f ~/.mcp/docker-compose.postgresql.ollama.yml logs -f ollama

  Verify server health:
    curl http://localhost:8000/health

  Stop the stack:
    docker compose -f ~/.mcp/docker-compose.postgresql.ollama.yml down

  Update (re-download compose file + pull newer images + restart):
    Just re-run the same script from https://github.com/GetActionSpace/mcp-context-server/blob/main/docs/connecting-ai-assistant.md

  Windows PowerShell: replace ~ with $HOME in the commands above.
