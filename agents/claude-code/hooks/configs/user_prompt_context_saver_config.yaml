# Message size limits for Windows subprocess pipe buffer handling
# Windows pipes typically have 64KB buffer; use conservative limits
message_limits:
  # Maximum message size in bytes before chunking (default: 32768 = 32KB)
  max_message_size: 32768
  # Size of each chunk in bytes (default: 30000 = ~30KB)
  chunk_size: 30000
  # Estimated bytes for JSON structure overhead
  json_overhead: 500

# Retry settings for thread ID file reading
thread_id:
  # Maximum retry attempts for reading thread ID file
  max_retries: 3

# MCP client settings
mcp_client:
  # Maximum retry attempts for MCP client creation
  max_retries: 3
  # Retry attempts for actual MCP connection (inside async with Client)
  max_connection_retries: 3
  # Timeout per connection attempt (seconds)
  connection_timeout: 60.0
  # Timeout in seconds for first run (may need package download)
  timeout_first_run: 240.0
  # Timeout in seconds for subsequent runs
  timeout_normal: 240.0
  # The hook's whole budget in seconds, measured from its launch: from the creation
  # of the uv process that started the hook, so the time uv spends preparing the
  # script's environment and starting the interpreter counts against it, and so does
  # the work before the store: reading this file and the prompt, and loading the MCP
  # client library. When the hook cannot identify that process, it counts from the
  # start of its module code instead. Every timeout above and the request
  # timeout below are capped by what remains of it, and no attempt starts once less
  # than a second remains. Keep it below the Claude Code hook timeout the
  # environment registers for this hook (the environment sets that timeout on the
  # hook's event entry; Claude Code's own default for a UserPromptSubmit hook is 30
  # seconds), so the hook always answers before it is killed with its output
  # discarded: with the stored context_id, or with a notice that the message was not
  # confirmed stored, which a startup that already used the whole budget gives at
  # once. The gap covers any shell start before uv, the hook's exit, and, when
  # the launch cannot be identified, the startup before the hook's clock. A store
  # request is sent at most once per run; only a failure before it is sent is
  # retried.
  deadline_seconds: 90.0

# MCP server command configuration
# Command and arguments to start the MCP context server
mcp_server:
  # Transport type: 'stdio' or 'http'
  transport: http
  # HTTP endpoint URL (required when transport: http)
  url: http://localhost:8000/mcp
  # Request timeout in seconds
  timeout: 60.0
  # Command to execute
  # command: uvx
  # Python version to use
  # python_version: "3.12"
  # Package with extras to install
  # package: mcp-context-server[embeddings-ollama]<2.0.0
  # Entry point to run
  # entry_point: mcp-context-server
  # Pre-warm the uvx cache before connecting over stdio to avoid cold start delays
  # prewarm_cache: true

# Chunking settings
# A message above max_message_size is split into chunks that one connection stores
# one by one, each sent exactly once; a chunk whose request fails is reported as
# failed rather than sent again, because the server may have received it.
chunking:
  # Failure mode for partial chunk storage. In every mode the partial failure reaches
  # the model through additionalContext (while output_context_id is on) and the hook's
  # debug log (while CLAUDE_HOOK_DEBUG_ENABLED is set). The modes differ only in one
  # extra stderr line; the hook exits 0, so Claude Code records that line only in its
  # own debug log, which exists only while its debug logging is on (for example under
  # --debug or --debug-file), and it appears neither in the transcript nor to the model.
  # 'silent': No stderr line
  # 'warn': A [WARN] line on stderr
  # 'error': An [ERROR] line on stderr
  fail_mode: warn

# Startup trace
# Every run records the stages it reaches in a trace file of its own, because a run
# Claude Code kills at its hook timeout leaves no output that says where it stalled.
# The trace is on by default and has no key in this file, because it starts before
# the file is read: set the environment variable CLAUDE_HOOK_STARTUP_TRACE to 0,
# false, or no to turn it off.
#
# Location: the claude_hook_user_prompt_context_saver_traces directory under the
# temporary directory Python resolves (the TMPDIR, TEMP, or TMP variable, else the
# platform default such as /tmp), one file per run named for its start time in UTC
# and its process id, such as 20250102T030405.678Z-12345.jsonl. A run that exits
# normally removes its own file, so every file there belongs to a run that was
# killed or crashed, and the newest sorts last. A run keeps at most 20 files in the
# directory, its own included, removing the oldest, but never one written within the
# last 600 seconds, which may belong to a run still in flight.
#
# Format: one JSON object per line, written and flushed as the run reaches each
# stage, with "stage", "at" (the wall-clock time in UTC), and "elapsed" (seconds
# since the hook's module code started). The stages, in the order a run reaches them:
#   module_start            the hook's code started; adds "pid" and "config" (the
#                           configuration file's path)
#   config_loaded           the configuration loader and its YAML library were loaded,
#                           and this file was read
#   stdin_read              the payload Claude Code sent was read
#   skip_decided            "store" says whether the prompt is stored
#   start_times             "interpreter_created" is when the process the hook runs in
#                           was created, and "redirector_created" when the venv
#                           redirector that started it was, which only Windows runs;
#                           each is null when it could not be read, and
#                           redirector_created also when no redirector started the
#                           interpreter; a turn that is not stored ends here
#   project_resolved        the project, the worktree, and the thread were resolved,
#                           which runs git
#   launcher_read           "launcher_created" is when the uv process that launched the
#                           hook was created, or null when it could not be identified
#   fastmcp_import_started  loading the MCP client library began
#   fastmcp_imported        the library is loaded
#   store_started           the store began
#   store_ended             "confirmed" says whether the store returned the server's
#                           answer rather than ending in an error
#
# Reading a leftover trace: the run stalled after the stage on its last line, before
# the next stage in the list above. A trace ending at module_start stalled while the
# run trimmed the traces of earlier runs or loaded its configuration: the loader and
# its YAML library, the run's first third-party import, then this file. One ending
# at skip_decided stalled while it read the start times from the process table,
# which no run reads before it decides the skip. The start times split the startup,
# from the moment Claude Code launches the hook command to the "at" of module_start.
# From the launch to interpreter_created is the shell Claude Code runs the command
# in, uv preparing the environment, and on Windows the redirector hop:
# redirector_created to interpreter_created is the redirector, the environment's
# small python.exe, starting the base interpreter the hook runs in, and on the store
# path launcher_created marks where the shell handed over to uv. From
# interpreter_created to module_start is the interpreter's own startup, through the
# standard library. The launch itself is in the session transcript: the time Claude
# Code canceled the hook less the duration it records for it. A run killed before
# its trace file was created leaves no file at all, whether it was killed before the
# hook's module code started or while the hook finished loading, located the
# temporary directory, and created the file.
