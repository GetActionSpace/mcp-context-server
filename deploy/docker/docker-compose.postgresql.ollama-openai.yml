# Docker Compose for MCP Context Server with PostgreSQL + Ollama Embeddings + OpenAI Summary
# Usage: docker compose -f deploy/docker/docker-compose.postgresql.ollama-openai.yml up -d
#
# REQUIRED: OpenAI API key must be configured before starting:
#   1. Copy .env-postgresql.ollama-openai.example to .env in this directory
#   2. Add your OPENAI_API_KEY to the .env file
#   3. Run: docker compose -f deploy/docker/docker-compose.postgresql.ollama-openai.yml up -d
#
# Row-level security (ENABLE_POSTGRESQL_RLS) stays off in this file: the app connects as the
# sidecar's bootstrap role, which owns the tables. To enable it, follow
# "Enabling row-level security" in docs/deployment/docker.md. The sidecar bootstraps its
# superuser from POSTGRESQL_MIGRATION_USER/POSTGRESQL_MIGRATION_PASSWORD when they are set,
# and from POSTGRESQL_USER/POSTGRESQL_PASSWORD otherwise.

name: context-server

services:
  mcp-context-server:
    image: ghcr.io/getactionspace/mcp-context-server:latest-ollama-openai
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      - MCP_TRANSPORT=http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      # Disable Rich log formatting and ASCII banner for clean single-line container logs
      - FASTMCP_ENABLE_RICH_LOGGING=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # PostgreSQL backend configuration
      - STORAGE_BACKEND=postgresql
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=${POSTGRESQL_USER:-postgres}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD:-postgres}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE:-mcp_context}
      # Semantic search configuration
      - ENABLE_SEMANTIC_SEARCH=true
      # Ollama embeddings configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      # Full-text and hybrid search
      - ENABLE_FTS=true
      - ENABLE_HYBRID_SEARCH=true
      # OpenAI summary generation (uses OPENAI_API_KEY from .env)
      - SUMMARY_PROVIDER=openai
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gpt-5.4-nano}
      # FlashRank reranking model cache (persistent across restarts)
      - RERANKING_CACHE_DIR=/cache/flashrank
    volumes:
      - flashrank-cache:/cache/flashrank
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: on-failure:5

  ollama:
    image: ollama/ollama:latest
    # For AMD ROCm GPU (Linux host only), use the ROCm-tagged image instead:
    # image: ollama/ollama:rocm
    pull_policy: always
    # Publish Ollama on the host loopback so host-side tools (e.g. Code Review
    # Graph) can reach it at http://127.0.0.1:11434; not exposed to the LAN.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      # Summary is handled by OpenAI, not Ollama
      - SUMMARY_PROVIDER=openai
      # Uncomment for Intel/Vulkan GPU (EXPERIMENTAL - may produce degraded output).
      # Linux host only -- NOT available on Docker Desktop for Windows (WSL2).
      # For Windows, run Ollama natively with OLLAMA_VULKAN=1 instead.
      # See docs/deployment/gpu-acceleration.md for details.
      # - OLLAMA_VULKAN=1
      # Uncomment if Intel Vulkan produces gibberish (disables integer dot product):
      # - GGML_VK_DISABLE_INTEGER_DOT_PRODUCT=1
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        /bin/ollama serve &
        serve_pid=$$!
        echo "Waiting for Ollama server to start..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "Checking embedding model: $${EMBEDDING_MODEL}..."
        if ! ollama show "$${EMBEDDING_MODEL}" >/dev/null 2>&1; then
          echo "Pulling embedding model: $${EMBEDDING_MODEL}..."
          ollama pull "$${EMBEDDING_MODEL}"
        else
          echo "Embedding model already cached."
        fi
        echo "Embedding model ready. Continuing Ollama server..."
        wait $$serve_pid
    # === GPU Acceleration ===
    # Uncomment ONE section based on your GPU vendor.
    # Full guide: docs/deployment/gpu-acceleration.md
    #
    # --- NVIDIA GPU (requires NVIDIA Container Toolkit) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    #
    # --- AMD GPU (requires ROCm driver on Linux host; also switch to image: ollama/ollama:rocm above) ---
    # Requires /dev/dri and /dev/kfd device nodes (Linux only). NOT available on Docker Desktop for Windows.
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    #
    # --- Intel/Vulkan GPU (EXPERIMENTAL - Linux host only, see docs for known issues) ---
    # Requires /dev/dri device nodes (Linux DRM). NOT available on Docker Desktop for Windows.
    # Also uncomment OLLAMA_VULKAN=1 in the environment section above.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${EMBEDDING_MODEL}\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18-trixie
    # Publish PostgreSQL on the host loopback so host tools (e.g. pgAdmin) can
    # connect at 127.0.0.1:5432; not exposed to the LAN. Credentials default to
    # postgres/postgres -- keep this loopback-only unless you change them.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_MIGRATION_USER:-${POSTGRESQL_USER:-postgres}}
      POSTGRES_PASSWORD: ${POSTGRESQL_MIGRATION_PASSWORD:-${POSTGRESQL_PASSWORD:-postgres}}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:-mcp_context}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
    name: mcp-context-postgresql-ollama-openai-data
  ollama-data:
    name: ollama-models
  flashrank-cache:
    name: flashrank-model-cache
