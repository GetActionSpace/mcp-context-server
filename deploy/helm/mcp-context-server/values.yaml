# Default values for mcp-context-server
# This is a YAML-formatted file.

# Image configuration
image:
  repository: ghcr.io/getactionspace/mcp-context-server
  # Defaults to Chart.appVersion if not set
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # ingress-nginx allows a 1 MiB request body and 60 s timeouts by default. The server
    # accepts bodies up to 4 MiB, and batch calls with generation on, such as those of
    # mcp-context-ingest, run longer (see "Limits" in docs/knowledge-base.md):
    # nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: mcp-context-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mcp-context-server-tls
  #    hosts:
  #      - mcp-context-server.local

# Resource limits
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Health probes
probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  startup:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30

# Environment configuration
env:
  MCP_TRANSPORT: "http"
  FASTMCP_HOST: "0.0.0.0"
  FASTMCP_PORT: "8000"
  FASTMCP_STATELESS_HTTP: "true"
  FASTMCP_ENABLE_RICH_LOGGING: "false"
  LOG_LEVEL: "INFO"

# Storage backend configuration
storage:
  backend: sqlite
  sqlite:
    enabled: true
    path: /data/context_storage.db
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
  postgresql:
    enabled: false
    host: ""
    port: "5432"
    user: "postgres"
    password: ""
    database: "mcp_context"
    sslMode: "prefer"
    # Use existing secret for password
    existingSecret: ""
    existingSecretKey: "postgresql-password"
    # Credentials of the role that owns the tables and runs migrations. Each one set
    # overrides the request user or password above for the migration connection only
    # (POSTGRESQL_MIGRATION_USER, POSTGRESQL_MIGRATION_PASSWORD); empty keeps the
    # request credentials. Required by rls.enabled.
    migration:
      user: ""
      password: ""
      # Use existing secret for the migration password
      existingSecret: ""
      existingSecretKey: "postgresql-migration-password"
    # PostgreSQL row-level security: the database also enforces the access model
    # (ENABLE_POSTGRESQL_RLS). Requests then connect as `user`, a login role that is a
    # member of the policy role and neither superuser nor BYPASSRLS, while migration.user
    # owns the tables. Create both roles before enabling it; see docs/deployment/helm.md.
    rls:
      enabled: false
      # NOLOGIN role the policies name (POSTGRESQL_RLS_POLICY_ROLE); empty keeps the
      # server default, mcp_context_request
      policyRole: ""

# HTTP authentication. Every value left empty keeps the server default, so nothing is
# rendered for it; see docs/authentication.md.
auth:
  # MCP_AUTH_PROVIDER: none (server default), simple_token or jwt
  provider: ""
  # MCP_AUTH_CLIENT_ID
  clientId: ""
  # MCP_AUTH_TOKEN, the simple_token bearer token, stored in the chart secret
  token: ""
  # Existing secret holding the bearer token (simple_token), the JWT public key
  # (jwt without jwksUri) or the anonymous verifier key (jwt with jwksUri); it
  # replaces token, jwt.publicKey and jwt.anonymousPublicKey
  existingSecret: ""
  tokenSecretKey: "mcp-auth-token"
  jwt:
    # MCP_AUTH_JWT_PUBLIC_KEY: PEM public key, or the shared secret of an HS*
    # algorithm, stored in the chart secret. Set this or jwksUri, not both.
    publicKey: ""
    publicKeySecretKey: "mcp-auth-jwt-public-key"
    # MCP_AUTH_JWT_JWKS_URI
    jwksUri: ""
    # MCP_AUTH_JWT_ISSUER
    issuer: ""
    # MCP_AUTH_JWT_AUDIENCE
    audience: ""
    # MCP_AUTH_JWT_ALGORITHM
    algorithm: ""
    # MCP_AUTH_ANONYMOUS_JWT_PUBLIC_KEY: PEM public key, or the shared secret of an
    # HS* algorithm, of the operator-held verifier that accepts only
    # accessControl.anonymousPrincipal beside the JWKS verifier. Rendered only with
    # provider jwt and jwksUri set, from the chart secret, or from existingSecret
    # under anonymousPublicKeySecretKey when that secret carries the key.
    anonymousPublicKey: ""
    anonymousPublicKeySecretKey: "mcp-auth-anonymous-jwt-public-key"
    # MCP_AUTH_ANONYMOUS_JWT_ALGORITHM
    anonymousAlgorithm: ""
  # MCP_AUTH_GROUPS_CLAIM
  groupsClaim: ""
  # MCP_AUTH_ROLES_CLAIM
  rolesClaim: ""

# Entry ownership and visibility policy. Every value left empty keeps the server
# default, so nothing is rendered for it; see docs/authentication.md.
accessControl:
  # ACCESS_CONTROL_DEFAULT_PRINCIPAL
  defaultPrincipal: ""
  # ACCESS_CONTROL_DEFAULT_VISIBILITY: private or public
  defaultVisibility: ""
  # ACCESS_CONTROL_DEFAULT_GROUP_GRANTS: none or author_groups
  defaultGroupGrants: ""
  # ACCESS_CONTROL_PUBLISH_ROLE
  publishRole: ""
  # ACCESS_CONTROL_ANONYMOUS_PRINCIPAL: the jwt subject every write tool refuses.
  # Empty makes no principal read-only; a value that differs from the minted sub
  # leaves that token writable.
  anonymousPrincipal: ""

# Search features. The fts/semantic/hybrid `enabled` flags map to the server's
# tri-state search toggles: true renders ENABLE_*="auto" (register the tool when
# its prerequisites are present), false renders "false" (force off). Full-text
# search needs no extra dependencies, so it is on by default; hybrid search builds
# on whichever of full-text/semantic is available.
search:
  fts:
    enabled: true
    language: "english"
  semantic:
    # Enables the embedding subsystem: drives ENABLE_EMBEDDING_GENERATION and
    # registers the semantic search tool (ENABLE_SEMANTIC_SEARCH=auto). Requires an
    # embedding provider (set ollama.enabled=true or configure an API key below);
    # keep false when no provider is available.
    enabled: false
    # Embedding provider: ollama (default), openai, azure, huggingface, voyage
    provider: "ollama"
    model: "qwen3-embedding:0.6b"
    dim: 1024
    # Query-side instruction prefix for instruct-aware embedding models, rendered as
    # EMBEDDING_QUERY_INSTRUCTION. Prepended verbatim to the text embedded for search
    # queries only; document embeddings on the store/update path always stay bare.
    # Empty leaves query text unchanged. The default qwen3-embedding:0.6b model
    # prescribes an instructed query side; set a double-quoted scalar so \n becomes
    # a real newline, e.g.
    # "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
    # See docs/environment-variables.md for the full guidance.
    queryInstruction: ""
    # Timeout and retry settings
    timeout: 240
    retryMaxAttempts: 5
    retryBaseDelay: 1.0
    # Concurrency control
    maxConcurrent: 3     # Maximum parallel embedding requests (1-20)
  hybrid:
    enabled: true
    rrfK: 60
    rrfOverfetch: 2  # Multiplier for over-fetching before RRF fusion
  # Text chunking for improved semantic search on long documents
  chunking:
    enabled: true
    size: 1500       # Target chunk size in characters
    overlap: 150     # Overlap between chunks in characters
    aggregation: max # How to aggregate chunk scores (only 'max' supported)
    dedupOverfetch: 5 # Multiplier for over-fetching before deduplication
  # Cross-encoder reranking for improved search precision
  reranking:
    enabled: true
    provider: flashrank
    model: ms-marco-MiniLM-L-12-v2
    maxLength: 512   # Maximum input length in tokens
    overfetch: 4     # Multiplier for over-fetching before reranking
    cacheDir: ""     # Custom cache directory for model files (empty = system default)
  # LLM-based summary generation. Opt-in like semantic search: it requires a summary
  # provider (set ollama.enabled=true for provider "ollama", or configure an API key
  # under summarySecrets for openai/anthropic). Keep false when no provider is available
  # -- enabling it without a reachable provider fails startup, mirroring
  # search.semantic.enabled.
  summary:
    enabled: false
    provider: "ollama"       # ollama (default), openai, or anthropic
    model: "qwen3:0.6b"     # Summary model
    maxTokens: 4000          # Max output tokens (50-16384)
    minContentLength: 500    # Min chars to trigger summary (0=always)
    prompt: ""               # Custom prompt (empty = built-in default)
    # Timeout and retry settings
    timeout: 240.0
    retryMaxAttempts: 5
    retryBaseDelay: 3.0
    # Concurrency control
    maxConcurrent: 2         # Shared summary-model budget: flat + per-node summaries (1-20)
  # Default sort order for search results
  defaultSortBy: relevance  # Only 'relevance' supported in current version

# Embedding compression (default ON; ~8x storage reduction).
# COMPRESSION_SEED is load-bearing and IMMUTABLE after the first server start.
# Pick a non-negative integer and keep it stable for the lifetime of this
# database; mismatching env vs DB seed refuses startup with exit 78.
# Set compression.enabled: false to opt out and use fp32 storage.
# See docs/embedding-compression.md for the full reference.
compression:
  enabled: true
  provider: turboquant
  bits: 4
  variant: ip
  seed: 0
  maxConcurrent: 4

# Ollama sidecar configuration (used when search.semantic.provider=ollama or search.summary.provider=ollama)
ollama:
  enabled: false
  # Embedding truncation control: false (default) returns error when context exceeded, true enables silent truncation
  embeddingTruncate: false
  # Embedding context window size in tokens (range: 512-2097152)
  embeddingNumCtx: 4096
  # Summary truncation control: false (default) returns error when context exceeded, true enables silent truncation
  summaryTruncate: false
  # Summary context window size in tokens (range: 512-2097152)
  summaryNumCtx: 32768
  # Presence penalty for summary calls (0-2). Empty keeps the server's model-family default:
  # 1.5 for a qwen3 model, no penalty for any other model
  summaryPresencePenalty: ""
  # Auto-pull models on startup via initContainer (derived from search.semantic.model and search.summary.model)
  # Set to false to disable auto-pull (models must be pre-loaded manually)
  autoPull: true
  image:
    repository: ollama/ollama
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
      # Uncomment to enable GPU acceleration (requires appropriate device plugin).
      # Full guide: docs/deployment/gpu-acceleration.md
      # nvidia.com/gpu: "1"    # NVIDIA (requires NVIDIA device plugin)
      # amd.com/gpu: "1"       # AMD (requires AMD GPU device plugin)
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

# LangSmith tracing (optional)
langsmith:
  enabled: false
  # API key stored in secret
  apiKey: ""
  endpoint: "https://api.smith.langchain.com"
  project: "mcp-context-server"
  # Use existing secret
  existingSecret: ""
  existingSecretKey: "langsmith-api-key"

# Provider-specific API keys (stored in secrets)
embeddingSecrets:
  # OpenAI
  openaiApiKey: ""
  # Azure OpenAI
  azureOpenaiApiKey: ""
  azureOpenaiEndpoint: ""
  azureOpenaiDeployment: ""
  azureOpenaiApiVersion: "2024-02-01"
  # HuggingFace
  huggingfaceApiToken: ""
  # Voyage AI
  voyageApiKey: ""
  # Use existing secret for all provider keys
  existingSecret: ""
  # Override the data key name inside existingSecret. Empty uses the active
  # embedding provider's default key name: openai-api-key / azure-openai-api-key
  # / huggingface-api-token / voyage-api-key.
  existingSecretKey: ""

# Summary provider API keys (for openai/anthropic providers)
summarySecrets:
  # OpenAI (when summary.provider=openai)
  openaiApiKey: ""
  # Anthropic (when summary.provider=anthropic)
  anthropicApiKey: ""
  # Use existing secret for summary provider keys
  existingSecret: ""
  # Override the data key name inside existingSecret. Empty uses the active
  # summary provider's default key name: openai-api-key (summary.provider=openai)
  # / anthropic-api-key (summary.provider=anthropic).
  existingSecretKey: ""

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}
