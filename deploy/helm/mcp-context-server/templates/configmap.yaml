{{- include "mcp-context-server.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-context-server.fullname" . }}
  labels:
    {{- include "mcp-context-server.labels" . | nindent 4 }}
data:
  # Transport settings
  MCP_TRANSPORT: {{ .Values.env.MCP_TRANSPORT | quote }}
  FASTMCP_HOST: {{ .Values.env.FASTMCP_HOST | quote }}
  FASTMCP_PORT: {{ .Values.env.FASTMCP_PORT | quote }}
  FASTMCP_STATELESS_HTTP: {{ .Values.env.FASTMCP_STATELESS_HTTP | quote }}
  HTTP_KEEP_ALIVE_TIMEOUT_S: {{ .Values.env.HTTP_KEEP_ALIVE_TIMEOUT_S | quote }}
  FASTMCP_ENABLE_RICH_LOGGING: {{ .Values.env.FASTMCP_ENABLE_RICH_LOGGING | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  # Storage backend
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  {{- if .Values.storage.sqlite.enabled }}
  DB_PATH: {{ .Values.storage.sqlite.path | quote }}
  {{- end }}
  {{- if .Values.storage.postgresql.enabled }}
  POSTGRESQL_HOST: {{ .Values.storage.postgresql.host | quote }}
  POSTGRESQL_PORT: {{ .Values.storage.postgresql.port | quote }}
  POSTGRESQL_USER: {{ .Values.storage.postgresql.user | quote }}
  POSTGRESQL_DATABASE: {{ .Values.storage.postgresql.database | quote }}
  POSTGRESQL_SSL_MODE: {{ .Values.storage.postgresql.sslMode | quote }}
  {{- with .Values.storage.postgresql.migration.user }}
  POSTGRESQL_MIGRATION_USER: {{ . | quote }}
  {{- end }}
  {{- end }}
  # Authentication, access control and row-level security: each variable renders only
  # when its value is set, so the server default applies otherwise.
  {{- with .Values.auth.provider }}
  MCP_AUTH_PROVIDER: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.clientId }}
  MCP_AUTH_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwt.jwksUri }}
  MCP_AUTH_JWT_JWKS_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwt.issuer }}
  MCP_AUTH_JWT_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwt.audience }}
  MCP_AUTH_JWT_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwt.algorithm }}
  MCP_AUTH_JWT_ALGORITHM: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.jwt.anonymousAlgorithm }}
  MCP_AUTH_ANONYMOUS_JWT_ALGORITHM: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.groupsClaim }}
  MCP_AUTH_GROUPS_CLAIM: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.rolesClaim }}
  MCP_AUTH_ROLES_CLAIM: {{ . | quote }}
  {{- end }}
  {{- with .Values.accessControl.defaultPrincipal }}
  ACCESS_CONTROL_DEFAULT_PRINCIPAL: {{ . | quote }}
  {{- end }}
  {{- with .Values.accessControl.defaultVisibility }}
  ACCESS_CONTROL_DEFAULT_VISIBILITY: {{ . | quote }}
  {{- end }}
  {{- with .Values.accessControl.defaultGroupGrants }}
  ACCESS_CONTROL_DEFAULT_GROUP_GRANTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.accessControl.publishRole }}
  ACCESS_CONTROL_PUBLISH_ROLE: {{ . | quote }}
  {{- end }}
  {{- with .Values.accessControl.anonymousPrincipal }}
  ACCESS_CONTROL_ANONYMOUS_PRINCIPAL: {{ . | quote }}
  {{- end }}
  {{- if .Values.storage.postgresql.rls.enabled }}
  ENABLE_POSTGRESQL_RLS: "true"
  {{- end }}
  {{- with .Values.storage.postgresql.rls.policyRole }}
  POSTGRESQL_RLS_POLICY_ROLE: {{ . | quote }}
  {{- end }}
  # Search features. The search.*.enabled booleans map to the server's tri-state
  # toggles: true -> "auto" (register the tool when its prerequisites are present),
  # false -> "false" (force off). search.semantic.enabled additionally provisions
  # the embedding subsystem: it drives ENABLE_EMBEDDING_GENERATION and the provider
  # config below, so embeddings are generated only when a provider is configured
  # (this avoids a startup failure when no embedding provider is available).
  ENABLE_FTS: {{ ternary "auto" "false" .Values.search.fts.enabled | quote }}
  {{- if .Values.search.fts.enabled }}
  FTS_LANGUAGE: {{ .Values.search.fts.language | quote }}
  {{- end }}
  ENABLE_EMBEDDING_GENERATION: {{ .Values.search.semantic.enabled | quote }}
  ENABLE_SEMANTIC_SEARCH: {{ ternary "auto" "false" .Values.search.semantic.enabled | quote }}
  {{- if .Values.search.semantic.enabled }}
  EMBEDDING_PROVIDER: {{ .Values.search.semantic.provider | quote }}
  EMBEDDING_MODEL: {{ .Values.search.semantic.model | quote }}
  EMBEDDING_DIM: {{ .Values.search.semantic.dim | quote }}
  {{- if .Values.search.semantic.queryInstruction }}
  EMBEDDING_QUERY_INSTRUCTION: {{ .Values.search.semantic.queryInstruction | quote }}
  {{- end }}
  EMBEDDING_TIMEOUT_S: {{ .Values.search.semantic.timeout | quote }}
  EMBEDDING_RETRY_MAX_ATTEMPTS: {{ .Values.search.semantic.retryMaxAttempts | quote }}
  EMBEDDING_RETRY_BASE_DELAY_S: {{ .Values.search.semantic.retryBaseDelay | quote }}
  EMBEDDING_MAX_CONCURRENT: {{ .Values.search.semantic.maxConcurrent | quote }}
  {{- if eq .Values.search.semantic.provider "azure" }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.embeddingSecrets.azureOpenaiEndpoint | quote }}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: {{ .Values.embeddingSecrets.azureOpenaiDeployment | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.embeddingSecrets.azureOpenaiApiVersion | quote }}
  {{- end }}
  {{- end }}
  # Ollama host (shared by semantic search and summary generation)
  {{- if and .Values.ollama.enabled (or (eq .Values.search.semantic.provider "ollama") (eq .Values.search.summary.provider "ollama")) }}
  OLLAMA_HOST: "http://localhost:11434"
  EMBEDDING_OLLAMA_TRUNCATE: {{ .Values.ollama.embeddingTruncate | quote }}
  EMBEDDING_OLLAMA_NUM_CTX: {{ .Values.ollama.embeddingNumCtx | quote }}
  SUMMARY_OLLAMA_TRUNCATE: {{ .Values.ollama.summaryTruncate | quote }}
  SUMMARY_OLLAMA_NUM_CTX: {{ .Values.ollama.summaryNumCtx | quote }}
  {{- if not (kindIs "invalid" .Values.ollama.summaryPresencePenalty) }}
  {{- if ne (toString .Values.ollama.summaryPresencePenalty) "" }}
  SUMMARY_OLLAMA_PRESENCE_PENALTY: {{ .Values.ollama.summaryPresencePenalty | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # LangSmith tracing (optional)
  {{- if .Values.langsmith.enabled }}
  LANGSMITH_TRACING: "true"
  LANGSMITH_ENDPOINT: {{ .Values.langsmith.endpoint | quote }}
  LANGSMITH_PROJECT: {{ .Values.langsmith.project | quote }}
  {{- end }}
  ENABLE_HYBRID_SEARCH: {{ ternary "auto" "false" .Values.search.hybrid.enabled | quote }}
  {{- if .Values.search.hybrid.enabled }}
  HYBRID_RRF_K: {{ .Values.search.hybrid.rrfK | quote }}
  HYBRID_RRF_OVERFETCH: {{ .Values.search.hybrid.rrfOverfetch | quote }}
  {{- end }}
  # Chunking settings
  ENABLE_CHUNKING: {{ .Values.search.chunking.enabled | quote }}
  {{- if .Values.search.chunking.enabled }}
  CHUNK_SIZE: {{ .Values.search.chunking.size | quote }}
  CHUNK_OVERLAP: {{ .Values.search.chunking.overlap | quote }}
  CHUNK_AGGREGATION: {{ .Values.search.chunking.aggregation | quote }}
  CHUNK_DEDUP_OVERFETCH: {{ .Values.search.chunking.dedupOverfetch | quote }}
  {{- end }}
  # Reranking settings
  ENABLE_RERANKING: {{ .Values.search.reranking.enabled | quote }}
  {{- if .Values.search.reranking.enabled }}
  RERANKING_PROVIDER: {{ .Values.search.reranking.provider | quote }}
  RERANKING_MODEL: {{ .Values.search.reranking.model | quote }}
  RERANKING_MAX_LENGTH: {{ .Values.search.reranking.maxLength | quote }}
  RERANKING_OVERFETCH: {{ .Values.search.reranking.overfetch | quote }}
  {{- if .Values.search.reranking.cacheDir }}
  RERANKING_CACHE_DIR: {{ .Values.search.reranking.cacheDir | quote }}
  {{- end }}
  {{- end }}
  # Summary generation settings
  ENABLE_SUMMARY_GENERATION: {{ .Values.search.summary.enabled | quote }}
  {{- if .Values.search.summary.enabled }}
  SUMMARY_PROVIDER: {{ .Values.search.summary.provider | quote }}
  SUMMARY_MODEL: {{ .Values.search.summary.model | quote }}
  SUMMARY_MAX_TOKENS: {{ .Values.search.summary.maxTokens | quote }}
  SUMMARY_MIN_CONTENT_LENGTH: {{ .Values.search.summary.minContentLength | quote }}
  {{- if .Values.search.summary.prompt }}
  SUMMARY_PROMPT: {{ .Values.search.summary.prompt | quote }}
  {{- end }}
  SUMMARY_TIMEOUT_S: {{ .Values.search.summary.timeout | quote }}
  SUMMARY_RETRY_MAX_ATTEMPTS: {{ .Values.search.summary.retryMaxAttempts | quote }}
  SUMMARY_RETRY_BASE_DELAY_S: {{ .Values.search.summary.retryBaseDelay | quote }}
  SUMMARY_MAX_CONCURRENT: {{ .Values.search.summary.maxConcurrent | quote }}
  {{- end }}
  # Embedding compression (default ON; see docs/embedding-compression.md)
  ENABLE_EMBEDDING_COMPRESSION: {{ .Values.compression.enabled | quote }}
  {{- if .Values.compression.enabled }}
  COMPRESSION_PROVIDER: {{ .Values.compression.provider | quote }}
  COMPRESSION_BITS: {{ .Values.compression.bits | quote }}
  COMPRESSION_VARIANT: {{ .Values.compression.variant | quote }}
  COMPRESSION_SEED: {{ .Values.compression.seed | quote }}
  COMPRESSION_MAX_CONCURRENT: {{ .Values.compression.maxConcurrent | quote }}
  {{- end }}
  # Search default sort
  SEARCH_DEFAULT_SORT_BY: {{ .Values.search.defaultSortBy | quote }}
