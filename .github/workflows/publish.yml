name: Build and Publish Application

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    env:
      SERVER_NAME: io.github.GetActionSpace/mcp-context-server
      PACKAGE_NAME: mcp-context-server
    outputs:
      dist-path: ${{ steps.build.outputs.dist-path }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Try release tag first, fall back to pyproject.toml
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"  # strip leading 'v' if present
            echo "Using release tag version: ${version}"
          else
            version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            echo "Using pyproject.toml version: ${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - name: Refresh uv.lock for this release
        run: |
          set -euo pipefail
          # Recreate lock so it captures the project version from the tagged commit
          uv lock
          test -f uv.lock || { echo 'uv.lock was not created' >&2; exit 1; }

      - name: Assert uv.lock contains the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ -z "$version" ]; then
            echo "ERROR: Version not determined" >&2
            exit 1
          fi
          # Check that the version string exists in uv.lock
          if grep -Eq "version\\s*=\\s*\"${version}\"" uv.lock; then
            echo "OK: uv.lock references version ${version}"
          else
            echo "uv.lock does not reference version ${version}" >&2
            echo 'Dumping first 80 lines for debugging:'
            head -n 80 uv.lock || true
            exit 1
          fi

      - name: Build component
        id: build
        run: |
          uv build
          echo "dist-path=dist" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: ${{ steps.build.outputs.dist-path }}/

      - name: Upload uv.lock
        uses: actions/upload-artifact@v7
        with:
          name: uv-lock
          path: uv.lock

  publish-to-pypi:
    name: Publish Application to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-context-server/${{ needs.build.outputs.version }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-to-mcp-registry:
    name: Publish Application to MCP Registry
    needs: [build, publish-to-pypi, publish-docker-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: read
    env:
      SERVER_NAME: io.github.GetActionSpace/mcp-context-server
      PACKAGE_NAME: mcp-context-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install mcp-publisher
        env:
          # Bump the version and its checksum together when upgrading mcp-publisher.
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          # Pin to an immutable release tag, never the mutable 'releases/latest' URL,
          # and verify the archive against the recorded SHA-256 before extracting or
          # running it. This binary later runs 'mcp-publisher login github-oidc' with
          # an id-token, so a swapped or tampered release asset must never reach
          # execution; a checksum mismatch aborts the job under 'set -e'.
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm -f mcp-publisher.tar.gz
          chmod +x mcp-publisher
          ./mcp-publisher --help

      - name: Wait for PyPI to serve this release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ -z "$version" ]; then
            echo "ERROR: Version not available from build job" >&2
            exit 1
          fi
          for i in {1..30}; do
            if curl -sf https://pypi.org/pypi/${PACKAGE_NAME}/json | jq -e --arg v "$version" '.releases[$v]'; then
              echo "PyPI has version $version"
              exit 0
            fi
            echo "Waiting for PyPI to serve $version, attempt $i"
            sleep 10
          done
          echo "Version $version not visible on PyPI yet"
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for GHCR to serve Docker image
        run: |
          set -euo pipefail

          # Extract OCI identifier from server.json
          OCI_IDENTIFIER=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          if [ -z "$OCI_IDENTIFIER" ] || [ "$OCI_IDENTIFIER" = "null" ]; then
            echo "ERROR: No OCI package identifier found in server.json" >&2
            exit 1
          fi
          echo "Checking for image: $OCI_IDENTIFIER"

          # Retry loop (30 attempts, 10s delay = 5 min max)
          for i in {1..30}; do
            if docker buildx imagetools inspect "$OCI_IDENTIFIER" > /dev/null 2>&1; then
              echo "GHCR has image $OCI_IDENTIFIER"
              exit 0
            fi
            echo "Waiting for GHCR to serve $OCI_IDENTIFIER, attempt $i"
            sleep 10
          done

          echo "ERROR: Image $OCI_IDENTIFIER not visible on GHCR after 30 attempts"
          exit 1

      - name: Login to MCP Registry using GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Check if version exists in MCP Registry
        id: check-mcp-version
        run: |
          set -euo pipefail
          expected_version=$(jq -r '.version' server.json)
          echo "Checking if version $expected_version already exists in MCP Registry..."

          # Paginate through all registry results to avoid missing versions
          # beyond the default 30-result page limit
          cursor=""
          while true; do
            url="https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&limit=100"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=${cursor}"
            fi
            response=$(curl -sf "$url" 2>/dev/null || echo '{"servers":[]}')

            version_exists=$(echo "$response" | jq -e --arg v "$expected_version" '.servers[] | select(.server.version == $v)' 2>/dev/null || echo "")
            if [ -n "$version_exists" ]; then
              echo "Version $expected_version already exists in MCP Registry - will skip publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check for next page
            cursor=$(echo "$response" | jq -r '.metadata.nextCursor // empty' 2>/dev/null)
            if [ -z "$cursor" ]; then
              break
            fi
            echo "Fetching next page (cursor: $cursor)..."
          done

          echo "Version $expected_version not found in MCP Registry - will proceed with publish"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish to MCP Registry
        if: steps.check-mcp-version.outputs.skip != 'true'
        run: ./mcp-publisher publish --file server.json

      - name: Verify in MCP Registry
        if: steps.check-mcp-version.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # Extract expected version from server.json (the file we just published)
          expected_version=$(jq -r '.version' server.json)
          echo "Expected version: $expected_version"

          # Retry parameters (matching PyPI wait logic)
          max_attempts=30
          delay=10

          for i in $(seq 1 $max_attempts); do
            echo "Attempt $i/$max_attempts: Checking MCP Registry for version $expected_version..."

            # Paginate through all registry results to find the version.
            # The search API has a default page size of 30 results, so
            # packages with many versions require cursor-based pagination.
            cursor=""
            found=""
            while true; do
              url="https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&limit=100"
              if [ -n "$cursor" ]; then
                url="${url}&cursor=${cursor}"
              fi
              response=$(curl -sf "$url" || echo '{"servers":[]}')

              # Check if version exists in this page
              found=$(echo "$response" | jq -e --arg v "$expected_version" '
                .servers[] | select(.server.version == $v)
              ' 2>/dev/null || echo "")

              if [ -n "$found" ]; then
                break
              fi

              # Check for next page
              cursor=$(echo "$response" | jq -r '.metadata.nextCursor // empty' 2>/dev/null)
              if [ -z "$cursor" ]; then
                break
              fi
            done

            if [ -n "$found" ]; then
              is_latest=$(echo "$found" | jq -r '._meta."io.modelcontextprotocol.registry/official".isLatest // false' 2>/dev/null)
              echo "SUCCESS: Version $expected_version found in MCP Registry (isLatest=$is_latest)"
              echo "Published entry:"
              echo "$found" | jq .
              exit 0
            fi

            echo "Version $expected_version not yet visible, waiting ${delay}s..."
            sleep $delay
          done

          echo "ERROR: Version $expected_version not found in MCP Registry after $max_attempts attempts"
          echo "Final registry response (first page):"
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&limit=100" | jq . || true
          exit 1

  publish-docker-image:
    name: Publish Docker Image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: getactionspace/mcp-context-server
      SERVER_NAME: io.github.GetActionSpace/mcp-context-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download uv.lock
        uses: actions/download-artifact@v8
        with:
          name: uv-lock
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.version }},enable=${{ !startsWith(needs.build.outputs.version, '0.') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            io.modelcontextprotocol.server.name=${{ env.SERVER_NAME }}
            org.opencontainers.image.description=MCP server providing persistent multimodal context storage for LLM agents. Ollama embeddings and summary provider.
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.vendor=ActionSpace
            org.opencontainers.image.documentation=https://github.com/GetActionSpace/mcp-context-server#readme
            org.opencontainers.image.base.name=docker.io/library/python:3.12-slim-bookworm
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=ollama
          cache-to: type=gha,mode=max,scope=ollama
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-docker-image-ollama-openai:
    name: Publish Docker Image to GHCR (Ollama-OpenAI)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: getactionspace/mcp-context-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download uv.lock
        uses: actions/download-artifact@v8
        with:
          name: uv-lock
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-ollama-openai,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.version }},enable=${{ !startsWith(needs.build.outputs.version, '0.') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=MCP server providing persistent multimodal context storage for LLM agents. Ollama embeddings + OpenAI summary provider.
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.vendor=ActionSpace
            org.opencontainers.image.documentation=https://github.com/GetActionSpace/mcp-context-server#readme
            org.opencontainers.image.base.name=docker.io/library/python:3.12-slim-bookworm
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            EMBEDDING_EXTRA=embeddings-ollama
            SUMMARY_EXTRA=summary-openai
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=ollama-openai
          cache-to: type=gha,mode=max,scope=ollama-openai
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
